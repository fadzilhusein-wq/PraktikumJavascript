<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>BMI Calculator</title>
</head>
<body>
    <h1>BMI Calculator</h1>
    <form id="bmiForm">
        <label for="weight">Weight (kg):</label>
        <input type="number" id="weight" min="0" step="0.1" required>
        <br><br>
        <label for="height">Height (m):</label>
        <input type="number" id="height" min="0" step="0.01" required>
        <br><br>
        <button type="submit">Calculate BMI</button>
        <button type="reset">Reset</button>
    </form>
    <p id="result"></p>

    <script>
        const form = document.getElementById('bmiForm');
        const result = document.getElementById('result');

        form.addEventListener('submit', function (event) {
            event.preventDefault();

            const weight = parseFloat(document.getElementById('weight').value);
            const height = parseFloat(document.getElementById('height').value);

            if (isNaN(weight) || isNaN(height) || weight <= 0 || height <= 0) {
                result.textContent = 'Please enter valid weight and height.';
                result.style.color = 'red';
                return;
            }

            const bmi = weight / (height * height);
            let category = '';

            if (bmi < 18.5) {
                category = 'Underweight';
            } else if (bmi < 25) {
                category = 'Normal weight';
            } else if (bmi < 30) {
                category = 'Overweight';
            } else {
                category = 'Obesity';
            }

            result.style.color = 'black';
            result.textContent = 'Your BMI is ' + bmi.toFixed(2) + ' (' + category + ')';
        });
    </script>
</body>
</html>
